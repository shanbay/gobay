defaults: &defaults
  bus_broker_url: "amqp://guest:guest@127.0.0.1:5672/"
  bus_reconnect_delay: "2s"
  bus_reinit_delay: "1s"
  bus_exchanges:
    - sbay-exchange
  bus_queues:
    - test
  bus_resend_delay: "1s"
  bus_publish_retry: 5
  bus_push_timeout: "3s"
  bus_prefetch: 10
  bus_quit_consumer_on_empty_queue: false
  bus_bindings:
    - exchange: sbay-exchange
      queue: test
      binding_key: gobay.buses.test

  stub_health_host: "127.0.0.1"
  stub_health_port: 5555
  stub_health_authority: "health-rpc.xyz"
  stub_health_metadata:
    svc_auth_token: "abcdefg"
  stub_health_conntimeout: 1s
  stub_health_calltimeout: 300ms
  stub_health_retrybackoff: 50ms
  stub_health_retrytimes: 3

  one_asynctask_concurrency: 10
  one_asynctask_broker: "redis://127.0.0.1:6379/8"
  one_asynctask_default_queue: "gobay.task.one"
  one_asynctask_result_backend: "redis://127.0.0.1:6379/8"
  one_asynctask_results_expire_in: 1
  one_asynctask_redis: {}

  two_asynctask_concurrency: 10
  two_asynctask_broker: "redis://127.0.0.1:6379/8"
  two_asynctask_default_queue: "gobay.task.two"
  two_asynctask_result_backend: "redis://127.0.0.1:6379/8"
  two_asynctask_results_expire_in: 1
  two_asynctask_redis: {}

  one_cronjob_bind_to: "one_asynctask_"
  one_cronjob_tz: "Asia/Shanghai"
  one_cronjob_health_check_port: 5001

  two_cronjob_bind_to: "two_asynctask_"
  two_cronjob_health_check_port: 5001

  db_driver: sqlite3
  db_url: ":memory:"

  short_url_alphabet: "mn6j2c4rv8bpygw95z7hsdaetxuk3fq"

  sentry_dsn: "http://user:pass@127.0.0.1/5"
  sentry_environment: "default"
  sentry_repanic: true

  cache_backend: "memory"
  cache_prefix: "github"
  cache_host: "127.0.0.1:6379"
  cache_password: ""
  cache_db: 3

  redis_host: "127.0.0.1:6379"
  redis_password: ""
  redis_db: 0
  redis_prefix: "github-redis"

  redisnoprefix_host: "127.0.0.1:6379"
  redisnoprefix_password: ""
  redisnoprefix_db: 0
  redisnoprefix_prefix: ""

  # busmonoff_ is used to verify busext metrics stay silent when monitor_enable
  # is left at its default (false/unset), sharing the "testing" env so it does
  # not need its own config block.
  busmonoff_broker_url: "amqp://guest:guest@127.0.0.1:5672/"
  busmonoff_reconnect_delay: "2s"
  busmonoff_reinit_delay: "1s"
  busmonoff_exchanges:
    - sbay-exchange
  busmonoff_queues:
    - busmonoff_test
  busmonoff_resend_delay: "1s"
  busmonoff_publish_retry: 5
  busmonoff_push_timeout: "3s"
  busmonoff_prefetch: 10
  busmonoff_bindings:
    - exchange: sbay-exchange
      queue: busmonoff_test
      binding_key: gobay.buses.busmonoff
testing:
  <<: *defaults
  db_driver: mysql
  db_url: "root:root@(127.0.0.1:3306)/gobay?charset=utf8mb4&parseTime=true"
grpclong:
  <<: *defaults
  stub_health_retrybackoff: 300ms
grpcnoretry:
  <<: *defaults
  stub_health_retrytimes: 0
grpcmocked:
  <<: *defaults
  stub_health_mocked: true
cachemonitored:
  <<: *defaults
  cache_monitor_enable: true
# cacheredis 用 redis backend（defaults 里是 memory），验证连接池参数能穿过
# GetConfigByPrefix 的前缀 trim 真正落到 redis.Options 上
cacheredis:
  <<: *defaults
  cache_backend: "redis"
  cache_poolsize: 7
  cache_pooltimeout: "9s"
# redispool 验证 redisext 的连接池默认值：redis_ 段不配任何池参数走默认值，
# redisexplicit_ 段显式配置以验证优先级，redisescape_ 段验证 poolsize: 0 逃生门。
# 注意用 addr 而非 host —— redisext 的 host 键不生效（见文档说明）
redispool:
  <<: *defaults
  redisexplicit_addr: "127.0.0.1:6379"
  redisexplicit_poolsize: 33
  redisexplicit_readtimeout: "120ms"
  redisexplicit_pooltimeout: "60ms"
  redisexplicit_idletimeout: "30s"
  redisexplicit_connmaxidletime: "30s"
  redisescape_addr: "127.0.0.1:6379"
  redisescape_poolsize: 0
  redisunderscore_addr: "127.0.0.1:6379"
  redisunderscore_pool_size: 50
  redisunderscore_read_timeout: "150ms"
  redisboth_addr: "127.0.0.1:6379"
  redisboth_poolsize: 50
  redisboth_pool_size: 77
asynctaskmonitored:
  <<: *defaults
  # three_asynctask_ / four_asynctask_ are dedicated NS prefixes (distinct
  # from one_asynctask_/two_asynctask_ used by the "testing" env) so the
  # monitor-enabled tests get their own queues and don't collide with the
  # always-on TestPushConsume workers.
  three_asynctask_concurrency: 10
  three_asynctask_broker: "redis://127.0.0.1:6379/8"
  three_asynctask_default_queue: "gobay.task.three"
  three_asynctask_result_backend: "redis://127.0.0.1:6379/8"
  three_asynctask_results_expire_in: 1
  three_asynctask_redis: {}
  three_asynctask_monitor_enable: true

  four_asynctask_concurrency: 10
  four_asynctask_broker: "redis://127.0.0.1:6379/8"
  four_asynctask_default_queue: "gobay.task.four"
  four_asynctask_result_backend: "redis://127.0.0.1:6379/8"
  four_asynctask_results_expire_in: 1
  four_asynctask_redis: {}
  four_asynctask_monitor_enable: true
busmonitored:
  <<: *defaults
  busmon_broker_url: "amqp://guest:guest@127.0.0.1:5672/"
  busmon_reconnect_delay: "2s"
  busmon_reinit_delay: "1s"
  busmon_exchanges:
    - sbay-exchange
  busmon_queues:
    - busmon_test
  busmon_resend_delay: "1s"
  busmon_publish_retry: 5
  busmon_push_timeout: "3s"
  busmon_prefetch: 10
  busmon_bindings:
    - exchange: sbay-exchange
      queue: busmon_test
      binding_key: gobay.buses.busmon
    - exchange: sbay-exchange
      queue: busmon_test
      binding_key: gobay.buses.busmon.failure
    - exchange: sbay-exchange
      queue: busmon_test
      binding_key: gobay.buses.busmon.parseerror
    # gobay.buses.busmon.unregistered is bound to the queue but deliberately
    # never registered as a consumer (see busmon.Register calls in
    # amqp_test.go), so a message published with this routing key exercises
    # the "invalid_message" (unregistered routing key) dispatch branch.
    - exchange: sbay-exchange
      queue: busmon_test
      binding_key: gobay.buses.busmon.unregistered
  busmon_monitor_enable: true
development:
  <<: *defaults
production:
  <<: *defaults
